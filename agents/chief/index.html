<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chief — Orchestrated People Ops (Demo)</title>

  <meta property="og:title" content="Chief — Orchestrated People Ops (Demo)">
  <meta property="og:description" content="Clean morning brief: top context bar + dashboard cards + chat input (bottom).">
  <meta property="og:type" content="website">

  <style>
    :root{
      --bg:#f9fafb;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --shadow:rgba(15,23,42,0.08);
      --accent-grad:linear-gradient(135deg,#f97373,#fb7185,#a855f7,#6366f1);
      --accent-soft:linear-gradient(135deg,rgba(249,115,129,.10),rgba(168,85,247,.10),rgba(99,102,241,.10));

      --good:#16a34a;
      --warn:#f59e0b;
      --bad:#ef4444;
      --info:#2563eb;
    }

    *{box-sizing:border-box;}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    .bar{height:4px;background:var(--accent-grad);}

    /* Top context bar (date/time/weather) */
    .top{
      max-width:1100px;
      margin:0 auto;
      padding:14px 16px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:220px;
    }
    .mark{
      width:34px;height:34px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--accent-soft);
      border:1px solid var(--border);
      font-size:16px;
      box-shadow:0 1px 2px var(--shadow);
    }
    .brand h1{
      margin:0;
      font-size:14px;
      font-weight:900;
      letter-spacing:-0.01em;
      line-height:1.1;
    }
    .brand .sub{
      margin-top:2px;
      font-size:12px;
      color:var(--muted);
    }

    .context{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 10px;
      border-radius:999px;
      border:1px solid rgba(148,163,184,.55);
      background:rgba(255,255,255,.95);
      font-size:12px;
      font-weight:800;
      color:#374151;
      box-shadow:0 1px 2px var(--shadow);
      white-space:nowrap;
    }

    /* Main panel */
    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:0 16px 90px; /* leave space for fixed chat */
    }

    .panel{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:0 1px 3px var(--shadow);
      overflow:hidden;
      min-height:520px;
    }

    .panel-head{
      padding:12px 14px;
      border-bottom:1px solid var(--border);
      background:var(--accent-soft);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .panel-head .title{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:900;
      letter-spacing:-0.01em;
    }
    .panel-head .title .emoji{
      width:30px;height:30px;
      border-radius:12px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.9);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 1px 2px var(--shadow);
    }
    .panel-head .hint{
      font-size:12px;
      color:var(--muted);
      font-weight:700;
    }

    .body{
      padding:14px;
      background:linear-gradient(180deg,#fff,#fbfdff);
    }

    /* Empty state */
    .empty{
      padding:26px 8px;
      text-align:center;
    }
    .empty h2{
      margin:0 0 8px;
      font-size:18px;
      font-weight:950;
      letter-spacing:-0.02em;
    }
    .empty p{
      margin:0;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    /* Dashboard cards */
    .grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(220px, 1fr));
      gap:12px;
    }
    @media (max-width:980px){ .grid{grid-template-columns:1fr;} }

    .card{
      border:1px solid var(--border);
      background:#fff;
      border-radius:18px;
      box-shadow:0 1px 3px var(--shadow);
      padding:12px 12px 10px;
      cursor:pointer;
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .card:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 30px rgba(0,0,0,.06);
    }
    .card-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
    }
    .card h3{
      margin:0;
      font-size:14px;
      font-weight:950;
      letter-spacing:-0.01em;
      line-height:1.2;
    }
    .card p{
      margin:0;
      font-size:13px;
      color:#374151;
      line-height:1.55;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:4px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:950;
      border:1px solid rgba(148,163,184,.55);
      background:rgba(255,255,255,.95);
      white-space:nowrap;
    }
    .b-good{color:#166534; border-color:rgba(22,163,74,.35); background:rgba(22,163,74,.08);}
    .b-warn{color:#92400e; border-color:rgba(245,158,11,.35); background:rgba(245,158,11,.08);}
    .b-bad{color:#991b1b; border-color:rgba(239,68,68,.35); background:rgba(239,68,68,.08);}
    .b-info{color:#1d4ed8; border-color:rgba(37,99,235,.35); background:rgba(37,99,235,.08);}

    /* Detail view */
    .detail{
      max-width:820px;
      margin:0 auto;
    }
    .detail-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    .detail-head h2{
      margin:0;
      font-size:18px;
      font-weight:950;
      letter-spacing:-0.02em;
    }
    .detail-head p{
      margin:6px 0 0;
      font-size:13px;
      color:var(--muted);
      line-height:1.45;
      max-width:60ch;
    }
    .btn{
      border:1px solid rgba(148,163,184,.65);
      background:rgba(255,255,255,.98);
      color:#4f46e5;
      border-radius:14px;
      padding:9px 12px;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:0 1px 2px var(--shadow);
    }
    .btn:hover{background:#fff; color:#4338ca;}
    .btn.primary{
      background:#4f46e5;
      border-color:#4f46e5;
      color:#fff;
    }
    .btn.primary:hover{background:#4338ca;border-color:#4338ca;color:#fff;}
    .btn.ghost{
      color:#111827;
    }

    .section{
      border:1px solid var(--border);
      background:#fff;
      border-radius:18px;
      box-shadow:0 1px 3px var(--shadow);
      padding:12px;
      margin:12px 0;
    }
    .section h4{
      margin:0 0 6px;
      font-size:13px;
      font-weight:950;
      letter-spacing:-0.01em;
    }
    .section .small{
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
      margin:0;
    }
    .divider{
      margin:12px 0;
      border-top:1px dashed #e5e7eb;
    }

    .kpis{
      display:grid;
      grid-template-columns:repeat(3, minmax(180px, 1fr));
      gap:10px;
      margin-top:10px;
    }
    @media (max-width:980px){ .kpis{grid-template-columns:1fr;} }
    .kpi{
      border:1px solid #eef2f7;
      background:#fbfdff;
      border-radius:16px;
      padding:10px;
    }
    .kpi .label{
      font-size:11px;
      color:var(--muted);
      letter-spacing:.08em;
      text-transform:uppercase;
      font-weight:900;
      margin-bottom:6px;
    }
    .kpi .value{
      font-size:16px;
      font-weight:950;
      letter-spacing:-0.01em;
    }

    /* Fixed chat (bottom) */
    .chat{
      position:fixed;
      left:0; right:0;
      bottom:0;
      padding:12px 12px 14px;
      background:linear-gradient(180deg, rgba(249,250,251,0), rgba(249,250,251,.95) 30%, rgba(249,250,251,1));
      backdrop-filter:saturate(120%) blur(6px);
    }
    .chat-inner{
      max-width:1100px;
      margin:0 auto;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px;
      border-radius:18px;
      border:1px solid var(--border);
      background:#fff;
      box-shadow:0 12px 30px rgba(0,0,0,.08);
    }
    .chat-icon{
      width:34px;height:34px;
      border-radius:14px;
      border:1px solid var(--border);
      background:var(--accent-soft);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      flex:0 0 auto;
    }
    .input{
      flex:1;
      border:1px solid var(--border);
      border-radius:14px;
      padding:11px 12px;
      font-size:13px;
      outline:none;
      background:#fbfdff;
    }

    /* Toast */
    .toast{
      position:fixed;
      left:50%;
      bottom:74px;
      transform:translateX(-50%);
      background:#111827;
      color:#fff;
      padding:10px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      box-shadow:0 12px 30px rgba(0,0,0,.18);
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease, transform .18s ease;
    }
    .toast.show{ opacity:1; transform:translateX(-50%) translateY(-2px); }
  </style>
</head>

<body>
  <div class="bar"></div>

  <!-- TOP CONTEXT -->
  <div class="top">
    <div class="brand">
      <div class="mark">🧠</div>
      <div>
        <h1>Chief</h1>
        <div class="sub" id="dateLine">—</div>
      </div>
    </div>

    <div class="context" aria-label="Date, time, and weather">
      <span class="pill" id="timePill">🕘 —</span>
      <span class="pill" id="weatherPill">☀️ Weather —</span>
    </div>
  </div>

  <!-- MAIN -->
  <div class="wrap">
    <div class="panel" aria-label="Morning brief dashboard">
      <div class="panel-head">
        <div class="title">
          <div class="emoji">📋</div>
          <div>Morning Brief</div>
        </div>
        <div class="hint" id="statusHint">Type “Review Morning Brief” below and press Enter.</div>
      </div>

      <div class="body" id="mainBody">
        <!-- injected -->
      </div>
    </div>
  </div>

  <!-- FIXED CHAT INPUT (BOTTOM) -->
  <div class="chat" aria-label="Chat input">
    <div class="chat-inner">
      <div class="chat-icon">💬</div>
      <input class="input" id="chatInput" />
      <button class="btn primary" id="sendBtn">Send</button>
    </div>
  </div>

  <div class="toast" id="toast">Saved.</div>

  <script>
    /***********************
     * Demo policy defaults
     ***********************/
    const POLICY = {
      globalMinSendsForLearning: 100,        // default threshold (global)
      roleOverrides: {                       // easily customizable when needed + approved
        // "Backend Engineer (US)": { minSendsForLearning: 200 }
      }
    };

    /***********************
     * Demo data (stub)
     ***********************/
    const DEMO = {
      locationLabel: "San Francisco (stub)",
      weatherLabel: "☀️ 58°F",
      roles: {
        "Backend Engineer (US)": {
          sendsToDate: 143,
          replyDipWoW: 9,
          openLiftFromSubjectOrder: 6,
          pipelineDeltaVsPlan: -18,
          breakPoint: "Screen → Hiring Manager"
        }
      },
      autonomy: {
        applied: [
          { tier: 1, label: "Send window optimization", detail: "Adjusted send time within approved window (no content changes)." },
          { tier: 2, label: "Subject ordering", detail: "Reordered approved subject lines after threshold met." },
          { tier: 3, label: "Variant pruning", detail: "Paused underperforming approved subject line (reversible)." }
        ],
        pending: [
          { tier: 4, label: "Draft body revision", detail: "Prepared a revised email body to address objections. Requires approval before any use." }
        ]
      }
    };

    /***********************
     * Helpers
     ***********************/
    const toast = document.getElementById("toast");
    function showToast(text){
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(()=>toast.classList.remove("show"), 1200);
    }

    function getRolePolicy(roleName){
      const override = POLICY.roleOverrides[roleName];
      return {
        minSendsForLearning: (override && override.minSendsForLearning) ? override.minSendsForLearning : POLICY.globalMinSendsForLearning
      };
    }

    function fmtDate(){
      const d = new Date();
      return d.toLocaleDateString(undefined, { weekday:"long", year:"numeric", month:"long", day:"numeric" });
    }
    function fmtTime(){
      const d = new Date();
      return d.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
    }

    /***********************
     * UI templates
     ***********************/
    const mainBody = document.getElementById("mainBody");
    const statusHint = document.getElementById("statusHint");

    function tplEmpty(){
      return `
        <div class="empty">
          <h2>Good morning.</h2>
          <p>Press Enter to review your morning brief.</p>
        </div>
      `;
    }

    function tplDashboard(){
      const role = DEMO.roles["Backend Engineer (US)"];
      const rolePolicy = getRolePolicy("Backend Engineer (US)");
      const thresholdMet = role.sendsToDate >= rolePolicy.minSendsForLearning;

      const autonomyAppliedCount = DEMO.autonomy.applied.length;
      const autonomyPendingCount = DEMO.autonomy.pending.length;

      return `
        <div class="grid" role="list">
          <div class="card" role="listitem" data-card="pipeline">
            <div class="card-top">
              <h3>Pipeline Health</h3>
              <span class="badge b-bad">⛔ At risk</span>
            </div>
            <p><strong>Backend Engineer (US)</strong> trending <strong>${role.pipelineDeltaVsPlan}% vs plan</strong>. Break at <strong>${role.breakPoint}</strong>.</p>
          </div>

          <div class="card" role="listitem" data-card="outreach">
            <div class="card-top">
              <h3>Outreach Signals</h3>
              <span class="badge b-warn">📉 Early signal</span>
            </div>
            <p>Reply rate down <strong>${role.replyDipWoW}% WoW</strong>. Learning threshold: <strong>${rolePolicy.minSendsForLearning}</strong> sends (${thresholdMet ? "met" : "not met"}).</p>
          </div>

          <div class="card" role="listitem" data-card="autonomy">
            <div class="card-top">
              <h3>Autonomy</h3>
              <span class="badge b-info">🧭 Tiered</span>
            </div>
            <p><strong>${autonomyAppliedCount}</strong> corrections applied within boundaries (Tier 1–3). <strong>${autonomyPendingCount}</strong> scope-expansion item pending approval (Tier 4).</p>
          </div>
        </div>

        <div style="max-width:820px;margin:14px auto 0;">
          <div class="section">
            <h4>Summary</h4>
            <p class="small">
              Chief applied low-risk optimizations within policy and is holding scope-expansion changes for approval.
              Default learning threshold is <strong>${POLICY.globalMinSendsForLearning}</strong> sends (global), with role-based overrides available when approved.
            </p>
          </div>
        </div>
      `;
    }

    function tplDetailPipeline(){
      const role = DEMO.roles["Backend Engineer (US)"];
      return `
        <div class="detail">
          <div class="detail-head">
            <div>
              <h2>Pipeline Health — Backend Engineer (US)</h2>
              <p>High risk flagged. This is a situational overview for decision-making (not a full analytics report).</p>
            </div>
            <button class="btn ghost" data-back="1">← Back</button>
          </div>

          <div class="section">
            <h4>What changed</h4>
            <p class="small">Pipeline volume trending <strong>${role.pipelineDeltaVsPlan}% vs plan</strong>. Primary breakpoint: <strong>${role.breakPoint}</strong>.</p>

            <div class="kpis">
              <div class="kpi">
                <div class="label">Risk Level</div>
                <div class="value">High</div>
                <div class="badge b-bad">⛔ Miss-start risk</div>
              </div>
              <div class="kpi">
                <div class="label">Primary Break</div>
                <div class="value">${role.breakPoint}</div>
                <div class="badge b-warn">⚠️ Conversion dip</div>
              </div>
              <div class="kpi">
                <div class="label">Fastest Lever</div>
                <div class="value">Outreach</div>
                <div class="badge b-good">✅ Low lift</div>
              </div>
            </div>
          </div>

          <div class="section">
            <h4>Recommended next review</h4>
            <p class="small">Review Outreach Signals first. It’s reversible and the fastest input lever.</p>
            <div class="divider"></div>
            <button class="btn primary" data-go="outreach">Review Outreach Signals</button>
          </div>
        </div>
      `;
    }

    function tplDetailOutreach(){
      const roleName = "Backend Engineer (US)";
      const role = DEMO.roles[roleName];
      const rolePolicy = getRolePolicy(roleName);
      const thresholdMet = role.sendsToDate >= rolePolicy.minSendsForLearning;

      return `
        <div class="detail">
          <div class="detail-head">
            <div>
              <h2>Outreach Signals — ${roleName}</h2>
              <p>Tiered autonomy applies: time-of-day + approved subject lines may optimize only after minimum sends.</p>
            </div>
            <button class="btn ghost" data-back="1">← Back</button>
          </div>

          <div class="section">
            <h4>Signal</h4>
            <p class="small">Reply rate down <strong>${role.replyDipWoW}% week over week</strong>. Send count to date: <strong>${role.sendsToDate}</strong>.</p>

            <div class="kpis">
              <div class="kpi">
                <div class="label">Learning threshold</div>
                <div class="value">${rolePolicy.minSendsForLearning}</div>
                <div class="badge ${thresholdMet ? "b-good" : "b-warn"}">${thresholdMet ? "✅ Met" : "⏳ Not met"}</div>
              </div>
              <div class="kpi">
                <div class="label">Within-boundary action</div>
                <div class="value">Subject ordering</div>
                <div class="badge b-info">Tier 2–3</div>
              </div>
              <div class="kpi">
                <div class="label">Projected lift</div>
                <div class="value">+${role.openLiftFromSubjectOrder}% opens</div>
                <div class="badge b-good">✅ Reversible</div>
              </div>
            </div>

            <div class="divider"></div>

            <p class="small">
              <strong>Rule:</strong> below <strong>${rolePolicy.minSendsForLearning}</strong> sends, Chief will not change optimization strategy
              (no learning-based updates) unless you explicitly command it. This prevents noisy conclusions from small samples.
            </p>
          </div>

          <div class="section">
            <h4>What was applied (within boundaries)</h4>
            <p class="small">If threshold is met, Chief may optimize <strong>send time</strong> and <strong>approved subject lines</strong> (Tier 1–3) and report outcomes.</p>
            <div class="divider"></div>
            <button class="btn" data-toast="Noted. This is an applied Tier 2–3 adjustment (demo).">Acknowledge</button>
          </div>

          <div class="section">
            <h4>What requires approval</h4>
            <p class="small"><strong>Tier 4:</strong> rewriting the full email body (or changing meaning/claims) is held for explicit approval.</p>
            <div class="divider"></div>
            <button class="btn primary" data-go="autonomy">Review Tier 4 pending item</button>
          </div>
        </div>
      `;
    }

    function tplDetailAutonomy(){
      const applied = DEMO.autonomy.applied;
      const pending = DEMO.autonomy.pending;

      return `
        <div class="detail">
          <div class="detail-head">
            <div>
              <h2>Autonomy — Tiered Policy</h2>
              <p>Global default: <strong>${POLICY.globalMinSendsForLearning}</strong> sends before learning-based changes. Overrides are available when needed and approved.</p>
            </div>
            <button class="btn ghost" data-back="1">← Back</button>
          </div>

          <div class="section">
            <h4>Completed within boundaries (Tier 1–3)</h4>
            <p class="small">These were applied autonomously because they’re low-risk and reversible.</p>
            <div class="divider"></div>
            <ul style="margin:0 0 0 18px;padding:0;color:#374151;font-size:13px;line-height:1.55;">
              ${applied.map(a=>`<li><strong>Tier ${a.tier}:</strong> ${a.label} — ${a.detail}</li>`).join("")}
            </ul>
          </div>

          <div class="section">
            <h4>Pending approval (Tier 4)</h4>
            <p class="small">Scope expansion changes are drafted but not applied.</p>
            <div class="divider"></div>
            ${pending.map(p=>`
              <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                <div>
                  <div style="font-weight:950;font-size:13px;">Tier ${p.tier}: ${p.label}</div>
                  <div class="small" style="margin-top:6px;">${p.detail}</div>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <button class="btn primary" data-toast="Approved Tier 4 (demo). Chief would apply and monitor.">Approve</button>
                  <button class="btn" data-toast="Rejected Tier 4 (demo). Draft discarded.">Reject</button>
                </div>
              </div>
            `).join("")}
          </div>

          <div class="section">
            <h4>Override controls (concept)</h4>
            <p class="small">
              Overrides are role-based and require approval to change thresholds (e.g., exec roles: higher threshold).
              This demo keeps overrides as a configuration concept (no UI controls needed on the morning screen).
            </p>
          </div>
        </div>
      `;
    }

    /***********************
     * Rendering + wiring
     ***********************/
    function render(view){
      if(view === "empty"){
        mainBody.innerHTML = tplEmpty();
        statusHint.textContent = "Press Enter to review your morning brief.";
        return;
      }
      if(view === "brief"){
        mainBody.innerHTML = tplDashboard();
        statusHint.textContent = "Click a card to review details.";
        wireCards();
        return;
      }
      if(view === "pipeline"){
        mainBody.innerHTML = tplDetailPipeline();
        wireDetail();
        return;
      }
      if(view === "outreach"){
        mainBody.innerHTML = tplDetailOutreach();
        wireDetail();
        return;
      }
      if(view === "autonomy"){
        mainBody.innerHTML = tplDetailAutonomy();
        wireDetail();
        return;
      }
      render("empty");
    }

    function wireCards(){
      mainBody.querySelectorAll("[data-card]").forEach(el=>{
        el.addEventListener("click", ()=>{
          const key = el.getAttribute("data-card");
          render(key);
        });
      });
    }

    function wireDetail(){
      mainBody.querySelectorAll("[data-back]").forEach(btn=>{
        btn.addEventListener("click", ()=> render("brief"));
      });
      mainBody.querySelectorAll("[data-go]").forEach(btn=>{
        btn.addEventListener("click", ()=> render(btn.getAttribute("data-go")));
      });
      mainBody.querySelectorAll("[data-toast]").forEach(btn=>{
        btn.addEventListener("click", ()=> showToast(btn.getAttribute("data-toast")));
      });
    }

    /***********************
     * Chat behavior
     ***********************/
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");

    function handleSend(){
      const t = (chatInput.value || "").trim();
      if(!t) return;

      const lower = t.toLowerCase();
      if(lower.includes("review morning brief") || lower.includes("morning brief")){
        render("brief");
        showToast("Morning brief loaded.");
        return;
      }
      if(lower.includes("pipeline")){ render("pipeline"); return; }
      if(lower.includes("outreach")){ render("outreach"); return; }
      if(lower.includes("autonomy") || lower.includes("tier")){ render("autonomy"); return; }

      showToast("Try: “Review Morning Brief”.");
    }

    sendBtn.addEventListener("click", handleSend);
    chatInput.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){
        e.preventDefault();
        handleSend();
      }
    });

    // Pre-fill prompt + focus behavior
    chatInput.value = "Review Morning Brief";
    chatInput.setSelectionRange(chatInput.value.length, chatInput.value.length);

    /***********************
     * Top context (date/time/weather)
     ***********************/
    document.getElementById("dateLine").textContent = fmtDate();

    const timePill = document.getElementById("timePill");
    function tickTime(){
      timePill.textContent = "🕘 " + fmtTime();
    }
    tickTime();
    setInterval(tickTime, 15000);

    const weatherPill = document.getElementById("weatherPill");
    weatherPill.textContent = `${DEMO.weatherLabel} · ${DEMO.locationLabel}`;

    /***********************
     * Boot
     ***********************/
    render("empty");
  </script>
</body>
</html>
