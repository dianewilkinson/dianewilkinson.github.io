<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chief — Morning Brief (Demo)</title>

  <meta property="og:title" content="Chief — Morning Brief (Demo)">
  <meta property="og:description" content="Recruiter morning brief: interviews, open reqs, projects, employer brand — with tiered autonomy + guardrails.">
  <meta property="og:type" content="website">

  <style>
    :root{
      --bg:#f9fafb;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --border:#e5e7eb;
      --shadow:rgba(15,23,42,0.08);
      --accent-grad:linear-gradient(135deg,#f97373,#fb7185,#a855f7,#6366f1);
      --accent-soft:linear-gradient(135deg,rgba(249,115,129,.10),rgba(168,85,247,.10),rgba(99,102,241,.10));

      --good:#16a34a;
      --warn:#f59e0b;
      --bad:#ef4444;
      --info:#2563eb;
    }

    *{box-sizing:border-box;}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    .bar{height:4px;background:var(--accent-grad);}

    /* Top context bar */
    .top{
      max-width:1120px;
      margin:0 auto;
      padding:14px 16px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:220px;
    }
    .mark{
      width:34px;height:34px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--accent-soft);
      border:1px solid var(--border);
      font-size:16px;
      box-shadow:0 1px 2px var(--shadow);
    }
    .brand h1{
      margin:0;
      font-size:14px;
      font-weight:950;
      letter-spacing:-0.01em;
      line-height:1.1;
    }
    .brand .sub{
      margin-top:2px;
      font-size:12px;
      color:var(--muted);
    }

    .context{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 10px;
      border-radius:999px;
      border:1px solid rgba(148,163,184,.55);
      background:rgba(255,255,255,.95);
      font-size:12px;
      font-weight:900;
      color:#374151;
      box-shadow:0 1px 2px var(--shadow);
      white-space:nowrap;
    }

    /* Chat bar (moved up under top context) */
    .chat{
      max-width:1120px;
      margin:0 auto;
      padding:0 16px 10px;
    }
    .chat-inner{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px;
      border-radius:18px;
      border:1px solid var(--border);
      background:#fff;
      box-shadow:0 12px 30px rgba(0,0,0,.08);
    }
    .chat-icon{
      width:34px;height:34px;
      border-radius:14px;
      border:1px solid var(--border);
      background:var(--accent-soft);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      flex:0 0 auto;
    }
    .input{
      flex:1;
      border:1px solid var(--border);
      border-radius:14px;
      padding:11px 12px;
      font-size:13px;
      outline:none;
      background:#fbfdff;
    }
    .btn{
      border:1px solid rgba(148,163,184,.65);
      background:rgba(255,255,255,.98);
      color:#4f46e5;
      border-radius:14px;
      padding:9px 12px;
      font-size:13px;
      font-weight:950;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:0 1px 2px var(--shadow);
    }
    .btn:hover{background:#fff; color:#4338ca;}
    .btn.primary{
      background:#4f46e5;
      border-color:#4f46e5;
      color:#fff;
    }
    .btn.primary:hover{background:#4338ca;border-color:#4338ca;color:#fff;}
    .btn.ghost{ color:#111827; }

    /* Main panel */
    .wrap{
      max-width:1120px;
      margin:0 auto;
      padding:0 16px 18px;
    }
    .panel{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:0 1px 3px var(--shadow);
      overflow:hidden;
      min-height:560px;
    }
    .panel-head{
      padding:12px 14px;
      border-bottom:1px solid var(--border);
      background:var(--accent-soft);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .panel-head .title{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:950;
      letter-spacing:-0.01em;
    }
    .panel-head .title .emoji{
      width:30px;height:30px;
      border-radius:12px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.9);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 1px 2px var(--shadow);
    }
    .panel-head .hint{
      font-size:12px;
      color:var(--muted);
      font-weight:800;
    }

    .body{
      padding:14px;
      background:linear-gradient(180deg,#fff,#fbfdff);
    }

    /* Empty state */
    .empty{
      padding:26px 8px;
      text-align:center;
    }
    .empty h2{
      margin:0 0 8px;
      font-size:18px;
      font-weight:950;
      letter-spacing:-0.02em;
    }
    .empty p{
      margin:0;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    /* Dashboard cards */
    .grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(320px, 1fr));
      gap:12px;
      align-items:stretch;
    }
    @media (max-width:980px){ .grid{grid-template-columns:1fr;} }

    .card{
      border:1px solid var(--border);
      background:#fff;
      border-radius:18px;
      box-shadow:0 1px 3px var(--shadow);
      padding:12px 12px 10px;
    }
    .card-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
    }
    .card h3{
      margin:0;
      font-size:14px;
      font-weight:950;
      letter-spacing:-0.01em;
      line-height:1.2;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:4px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:950;
      border:1px solid rgba(148,163,184,.55);
      background:rgba(255,255,255,.95);
      white-space:nowrap;
    }
    .b-good{color:#166534; border-color:rgba(22,163,74,.35); background:rgba(22,163,74,.08);}
    .b-warn{color:#92400e; border-color:rgba(245,158,11,.35); background:rgba(245,158,11,.08);}
    .b-bad{color:#991b1b; border-color:rgba(239,68,68,.35); background:rgba(239,68,68,.08);}
    .b-info{color:#1d4ed8; border-color:rgba(37,99,235,.35); background:rgba(37,99,235,.08);}

    /* Mini list inside cards */
    .mini{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:6px;
    }
    .mini-row{
      border:1px solid var(--border);
      border-radius:14px;
      padding:9px 10px;
      background:#fff;
      box-shadow:0 1px 2px var(--shadow);
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      cursor:pointer;
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .mini-row:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 26px rgba(0,0,0,.06);
    }
    .mini-left{min-width:0;}
    .mini-title{
      margin:0;
      font-size:12.5px;
      font-weight:950;
      letter-spacing:-0.01em;
      color:#111827;
      line-height:1.25;
    }
    .mini-sub{
      margin-top:4px;
      font-size:12px;
      color:var(--muted);
      line-height:1.35;
    }
    .mini-right{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
      flex:0 0 auto;
    }

    /* Detail pages */
    .detail{
      max-width:900px;
      margin:0 auto;
    }
    .detail-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    .detail-head h2{
      margin:0;
      font-size:18px;
      font-weight:950;
      letter-spacing:-0.02em;
    }
    .detail-head p{
      margin:6px 0 0;
      font-size:13px;
      color:var(--muted);
      line-height:1.45;
      max-width:68ch;
    }
    .section{
      border:1px solid var(--border);
      background:#fff;
      border-radius:18px;
      box-shadow:0 1px 3px var(--shadow);
      padding:12px;
      margin:12px 0;
    }
    .section h4{
      margin:0 0 6px;
      font-size:13px;
      font-weight:950;
      letter-spacing:-0.01em;
    }
    .small{
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
      margin:0;
    }
    .divider{
      margin:12px 0;
      border-top:1px dashed #e5e7eb;
    }

    /* “Choose your adventure” tiles */
    .tiles{
      display:grid;
      grid-template-columns:repeat(3, minmax(220px, 1fr));
      gap:10px;
      margin-top:10px;
    }
    @media (max-width:980px){ .tiles{grid-template-columns:1fr;} }
    .tile{
      border:1px solid var(--border);
      border-radius:18px;
      background:#fff;
      box-shadow:0 1px 3px var(--shadow);
      padding:12px;
      cursor:pointer;
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .tile:hover{transform:translateY(-1px); box-shadow:0 10px 30px rgba(0,0,0,.06);}
    .tile h5{
      margin:0 0 6px;
      font-size:13px;
      font-weight:950;
      letter-spacing:-0.01em;
    }
    .tile p{
      margin:0;
      font-size:12px;
      color:var(--muted);
      line-height:1.45;
    }

    /* Toast */
    .toast{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      background:#111827;
      color:#fff;
      padding:10px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:950;
      box-shadow:0 12px 30px rgba(0,0,0,.18);
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease, transform .18s ease;
    }
    .toast.show{ opacity:1; transform:translateX(-50%) translateY(-2px); }
  </style>
</head>

<body>
  <div class="bar"></div>

  <!-- TOP CONTEXT -->
  <div class="top">
    <div class="brand">
      <div class="mark">🧠</div>
      <div>
        <h1>Chief</h1>
        <div class="sub" id="dateLine">—</div>
      </div>
    </div>

    <div class="context" aria-label="Date, time, and weather">
      <span class="pill" id="timePill">🕘 —</span>
      <span class="pill" id="weatherPill">☀️ Weather —</span>
    </div>
  </div>

  <!-- CHAT BAR (MOVED UP) -->
  <div class="chat" aria-label="Chat input">
    <div class="chat-inner">
      <div class="chat-icon">💬</div>
      <input class="input" id="chatInput" />
      <button class="btn primary" id="sendBtn">Send</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="wrap">
    <div class="panel" aria-label="Morning brief dashboard">
      <div class="panel-head">
        <div class="title">
          <div class="emoji">📋</div>
          <div id="panelTitle">Morning Brief</div>
        </div>
        <div class="hint" id="statusHint">Press Enter to review your morning brief.</div>
      </div>

      <div class="body" id="mainBody">
        <!-- injected -->
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Saved.</div>

  <script>
    /***********************
     * Policy (global default + role overrides when approved)
     * (Not shown on the morning brief dashboard; appears only on Outreach detail views.)
     ***********************/
    const POLICY = {
      globalMinSendsForLearning: 100,
      roleOverrides: {
        // example: "Executive Search (VP Eng)": { minSendsForLearning: 250 }
      }
    };

    function getRolePolicy(roleName){
      const override = POLICY.roleOverrides[roleName];
      return {
        minSendsForLearning: (override && override.minSendsForLearning)
          ? override.minSendsForLearning
          : POLICY.globalMinSendsForLearning
      };
    }

    /***********************
     * Demo data (stub)
     ***********************/
    const DATA = {
      locationLabel: "San Francisco (stub)",
      weatherLabel: "☀️ 58°F",
      interviews: [
        { id:"i1", time:"10:30", candidate:"A. Chen", stage:"HM Screen", interviewer:"J. Rivera", reqId:"r1", prepNeeded:true },
        { id:"i2", time:"11:15", candidate:"M. Patel", stage:"Tech Screen", interviewer:"S. Kim", reqId:"r1", prepNeeded:false },
        { id:"i3", time:"1:00",  candidate:"L. Gomez", stage:"Panel",     interviewer:"Panel (3)", reqId:"r2", prepNeeded:true },
        { id:"i4", time:"2:30",  candidate:"K. Nguyen", stage:"Recruiter Screen", interviewer:"You", reqId:"r3", prepNeeded:false },
        { id:"i5", time:"4:00",  candidate:"R. Singh", stage:"Offer Chat", interviewer:"HM + You", reqId:"r2", prepNeeded:false }
      ],
      requisitions: [
        {
          id:"r1",
          title:"Backend Engineer (US)",
          location:"Remote / US",
          health:"at_risk", // healthy | early | at_risk
          why:"Break at Screen → HM. Volume trending below plan.",
          sendsToDate:143,
          replyDipWoW:9,
          pipelineDeltaVsPlan:-18,
          breakPoint:"Screen → Hiring Manager",
          autonomy:{
            applied:[
              { tier:1, label:"Send window optimization", detail:"Adjusted send time within approved window (no content changes)." },
              { tier:2, label:"Subject ordering", detail:"Reordered approved subject lines after threshold met." },
              { tier:3, label:"Variant pruning", detail:"Paused underperforming approved subject line (reversible)." }
            ],
            pending:[
              { tier:4, label:"Draft body revision", detail:"Prepared revised body copy. Requires approval before use." }
            ]
          }
        },
        {
          id:"r2",
          title:"Data Engineer (SF)",
          location:"San Francisco, CA",
          health:"early",
          why:"Early signal: response softening in senior band.",
          sendsToDate:98,
          replyDipWoW:4,
          pipelineDeltaVsPlan:-6,
          breakPoint:"Sourcing → Screen",
          autonomy:{
            applied:[
              { tier:1, label:"Delivery hygiene", detail:"Retried failed sends; cleaned formatting (no meaning changes)." }
            ],
            pending:[]
          }
        },
        {
          id:"r3",
          title:"Recruiting Operations (Contract)",
          location:"Remote",
          health:"healthy",
          why:"On track. Interview loop is staffed and moving.",
          sendsToDate:210,
          replyDipWoW:1,
          pipelineDeltaVsPlan:3,
          breakPoint:"—",
          autonomy:{
            applied:[
              { tier:1, label:"Send scheduling", detail:"Aligned send time to approved window." }
            ],
            pending:[]
          }
        }
      ],
      projects: [
        { id:"p1", title:"Market map — ML Platform (next quarter req)", due:"Tue", status:"Needs attention", next:"Finalize target company list + share with HM." },
        { id:"p2", title:"New req intake — Security Eng (opens next week)", due:"Fri", status:"In progress", next:"Draft kickoff doc + calibration questions." },
        { id:"p3", title:"Interview loop cleanup", due:"—", status:"Backlog", next:"Standardize scorecard rubric for Eng roles." }
      ],
      brand: {
        items: [
          { id:"b1", type:"Glassdoor", title:"Response needed: 3★ review", status:"Pending", note:"Draft ready (Tier 4 approval if posting)." },
          { id:"b2", type:"Glassdoor", title:"Response needed: 2★ review", status:"Pending", note:"No draft yet." },
          { id:"b3", type:"LinkedIn", title:"Scheduled post: Hiring update", status:"Scheduled", note:"Goes out at 12:05 (Tier 1 scheduling)." }
        ]
      }
    };

    /***********************
     * Helpers
     ***********************/
    const toast = document.getElementById("toast");
    function showToast(text){
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(()=>toast.classList.remove("show"), 1200);
    }

    function fmtDate(){
      const d = new Date();
      return d.toLocaleDateString(undefined, { weekday:"long", year:"numeric", month:"long", day:"numeric" });
    }
    function fmtTime(){
      const d = new Date();
      return d.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
    }

    function healthBadge(health){
      if(health === "healthy") return `<span class="badge b-good">✅ Healthy</span>`;
      if(health === "early") return `<span class="badge b-warn">📉 Early signal</span>`;
      return `<span class="badge b-bad">⛔ At risk</span>`;
    }

    /***********************
     * Render state
     ***********************/
    const mainBody = document.getElementById("mainBody");
    const statusHint = document.getElementById("statusHint");
    const panelTitle = document.getElementById("panelTitle");

    function setHeader(title, hint){
      panelTitle.textContent = title;
      statusHint.textContent = hint;
    }

    /***********************
     * Templates
     ***********************/
    function tplEmpty(){
      setHeader("Morning Brief", "Press Enter to review your morning brief.");
      return `
        <div class="empty">
          <h2>Good morning.</h2>
          <p>Press Enter to load your day: interviews, open requisitions, projects, and employer brand.</p>
        </div>
      `;
    }

    function tplBrief(){
      const prepNeeded = DATA.interviews.filter(i=>i.prepNeeded).length;

      setHeader("Morning Brief", "Click an item for details.");
      return `
        <div class="grid" role="list">

          <!-- Interviews -->
          <div class="card" role="listitem">
            <div class="card-top">
              <h3>Today’s Interviews</h3>
              <span class="badge ${prepNeeded ? "b-warn" : "b-good"}">
                ${prepNeeded ? `⚠️ Prep: ${prepNeeded}` : "✅ Ready"}
              </span>
            </div>

            <div class="mini">
              ${DATA.interviews.map(i=>`
                <div class="mini-row" data-interview="${i.id}">
                  <div class="mini-left">
                    <div class="mini-title">${i.time} — ${i.candidate}</div>
                    <div class="mini-sub">${i.stage} · ${i.interviewer}</div>
                  </div>
                  <div class="mini-right">
                    ${i.prepNeeded ? `<span class="badge b-warn">Prep</span>` : `<span class="badge b-good">Ready</span>`}
                  </div>
                </div>
              `).join("")}
            </div>
          </div>

          <!-- Open reqs -->
          <div class="card" role="listitem">
            <div class="card-top">
              <h3>Open Requisitions</h3>
              <span class="badge b-info">📌 ${DATA.requisitions.length} open</span>
            </div>

            <div class="mini">
              ${DATA.requisitions.map(r=>`
                <div class="mini-row" data-req="${r.id}">
                  <div class="mini-left">
                    <div class="mini-title">${r.title}</div>
                    <div class="mini-sub">${r.location}</div>
                  </div>
                  <div class="mini-right">
                    ${healthBadge(r.health)}
                  </div>
                </div>
              `).join("")}
            </div>
          </div>

          <!-- Projects -->
          <div class="card" role="listitem">
            <div class="card-top">
              <h3>Projects & Deadlines</h3>
              <span class="badge b-info">🧩 ${DATA.projects.length} active</span>
            </div>

            <div class="mini">
              ${DATA.projects.map(p=>`
                <div class="mini-row" data-project="${p.id}">
                  <div class="mini-left">
                    <div class="mini-title">${p.title}</div>
                    <div class="mini-sub">Due: ${p.due} · ${p.status}</div>
                  </div>
                  <div class="mini-right">
                    <span class="badge b-info">Next</span>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>

          <!-- Brand -->
          <div class="card" role="listitem">
            <div class="card-top">
              <h3>Employer Brand / Socials</h3>
              <span class="badge b-info">💬 ${DATA.brand.items.length} items</span>
            </div>

            <div class="mini">
              ${DATA.brand.items.map(b=>`
                <div class="mini-row" data-brand="${b.id}">
                  <div class="mini-left">
                    <div class="mini-title">${b.type}: ${b.title}</div>
                    <div class="mini-sub">${b.status} · ${b.note}</div>
                  </div>
                  <div class="mini-right">
                    <span class="badge b-info">Review</span>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>

        </div>
      `;
    }

    function tplInterviewDetail(interviewId){
      const i = DATA.interviews.find(x=>x.id===interviewId);
      if(!i) return tplBrief();

      const req = DATA.requisitions.find(r=>r.id===i.reqId);

      setHeader("Interview Prep", "Review summary, then choose next action.");
      return `
        <div class="detail">
          <div class="detail-head">
            <div>
              <h2>${i.time} — ${i.candidate} (${i.stage})</h2>
              <p>${req ? req.title : "Requisition"} · Interviewer: ${i.interviewer}</p>
            </div>
            <button class="btn ghost" data-nav="brief">← Back</button>
          </div>

          <div class="section">
            <h4>Candidate summary (stub)</h4>
            <p class="small">
              6+ years backend · Python/Go · scaled services to 10M+ users. Strength: ownership + reliability.
              Risk: limited distributed tracing depth. Focus: incidents, tradeoffs, boundaries.
            </p>

            <div class="divider"></div>

            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn" data-toast="Would open scorecard (stub).">Open scorecard</button>
              <button class="btn" data-toast="Would send reminder within Tier 1 (stub).">Send reminder</button>
              ${req ? `<button class="btn primary" data-req="${req.id}" data-nav="req_detail">View req brief</button>` : ""}
            </div>
          </div>

          <div class="section">
            <h4>Prep status</h4>
            <p class="small">${i.prepNeeded ? "⚠️ Prep flagged: key notes missing. Consider reviewing last interview feedback before start." : "✅ Prep complete."}</p>
          </div>
        </div>
      `;
    }

    function tplReqDetail(reqId){
      const r = DATA.requisitions.find(x=>x.id===reqId);
      if(!r) return tplBrief();

      const rp = getRolePolicy(r.title);
      const thresholdMet = r.sendsToDate >= rp.minSendsForLearning;

      setHeader("Req Brief", "Choose your adventure: Pipeline, Outreach, or Loop.");
      return `
        <div class="detail">
          <div class="detail-head">
            <div>
              <h2>${r.title}</h2>
              <p>${r.location} · ${healthBadge(r.health)} · ${r.why}</p>
            </div>
            <button class="btn ghost" data-nav="brief">← Back</button>
          </div>

          <div class="section">
            <h4>Quick status</h4>
            <p class="small">
              Pipeline vs plan: <strong>${r.pipelineDeltaVsPlan}%</strong> · Break: <strong>${r.breakPoint}</strong> · Sends: <strong>${r.sendsToDate}</strong> · Reply dip: <strong>${r.replyDipWoW}% WoW</strong>
            </p>
            <div class="divider"></div>
            <p class="small">
              Learning threshold: <strong>${rp.minSendsForLearning}</strong> (${thresholdMet ? "met" : "not met"}).
              Below threshold, Chief will not make learning-based changes unless you explicitly command it.
            </p>
          </div>

          <div class="section">
            <h4>Choose your adventure</h4>
            <div class="tiles">
              <div class="tile" data-nav="req_pipeline" data-req="${r.id}">
                <h5>📊 Pipeline</h5>
                <p>Bottlenecks, stage breaks, throughput levers.</p>
              </div>
              <div class="tile" data-nav="req_outreach" data-req="${r.id}">
                <h5>✉️ Outreach</h5>
                <p>Signals, learning threshold, tiered autonomy.</p>
              </div>
              <div class="tile" data-nav="req_loop" data-req="${r.id}">
                <h5>🧩 Interview Loop</h5>
                <p>Scorecards, SLA, decision friction.</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function tplReqPipeline(reqId){
      const r = DATA.requisitions.find(x=>x.id===reqId);
      if(!r) return tplBrief();

      setHeader("Req · Pipeline", "Troubleshoot bottlenecks and levers.");
      return `
        <div class="detail">
          <div class="detail-head">
            <div>
              <h2>${r.title} — Pipeline</h2>
              <p>Decision-first: where flow breaks and what lever is lowest-lift.</p>
            </div>
            <button class="btn ghost" data-nav="req_detail" data-req="${r.id}">← Back</button>
          </div>

          <div class="section">
            <h4>What changed</h4>
            <p class="small">Pipeline trending <strong>${r.pipelineDeltaVsPlan}% vs plan</strong>. Primary breakpoint: <strong>${r.breakPoint}</strong>.</p>
          </div>

          <div class="section">
            <h4>Next actions (choose)</h4>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn primary" data-nav="req_outreach" data-req="${r.id}">Review outreach levers</button>
              <button class="btn" data-toast="Would open forecasting sheet (stub).">Open planning sheet</button>
              <button class="btn" data-toast="Would generate HM calibration prompts (stub).">Generate HM calibration prompts</button>
            </div>
          </div>
        </div>
      `;
    }

    function tplReqOutreach(reqId){
      const r = DATA.requisitions.find(x=>x.id===reqId);
      if(!r) return tplBrief();

      const rp = getRolePolicy(r.title);
      const thresholdMet = r.sendsToDate >= rp.minSendsForLearning;

      setHeader("Req · Outreach", "Tiered autonomy + threshold guardrails.");
      return `
        <div class="detail">
          <div class="detail-head">
            <div>
              <h2>${r.title} — Outreach</h2>
              <p>Below <strong>${rp.minSendsForLearning}</strong> sends: monitor only unless commanded. Above threshold: Tier 1–3 may run within approved scope.</p>
            </div>
            <button class="btn ghost" data-nav="req_detail" data-req="${r.id}">← Back</button>
          </div>

          <div class="section">
            <h4>Signal + threshold</h4>
            <p class="small">Sends: <strong>${r.sendsToDate}</strong> · Reply dip: <strong>${r.replyDipWoW}% WoW</strong></p>
            <div class="divider"></div>
            <p class="small">
              Learning threshold: <strong>${rp.minSendsForLearning}</strong> (${thresholdMet ? "✅ met" : "⏳ not met"}).
              ${thresholdMet
                ? "Tier 2–3 optimization is permitted within the approved scope (send time + approved subject lines)."
                : "No learning-based changes will be made below threshold unless you explicitly command it."
              }
            </p>
          </div>

          <div class="section">
            <h4>Already applied (Tier 1–3) — within boundaries</h4>
            ${r.autonomy.applied.length
              ? `<ul style="margin:0 0 0 18px;padding:0;color:#374151;font-size:13px;line-height:1.55;">
                  ${r.autonomy.applied.map(a=>`<li><strong>Tier ${a.tier}:</strong> ${a.label} — ${a.detail}</li>`).join("")}
                 </ul>`
              : `<p class="small">No within-boundary changes applied for this req.</p>`
            }
          </div>

          <div class="section">
            <h4>Pending approval (Tier 4) — scope expansion</h4>
            ${r.autonomy.pending.length
              ? r.autonomy.pending.map(p=>`
                  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                    <div>
                      <div style="font-weight:950;font-size:13px;">Tier ${p.tier}: ${p.label}</div>
                      <div class="small" style="margin-top:6px;">${p.detail}</div>
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                      <button class="btn primary" data-toast="Approved Tier 4 (demo). Would apply + audit log.">Approve</button>
                      <button class="btn" data-toast="Rejected Tier 4 (demo). Draft discarded.">Reject</button>
                    </div>
                  </div>
                `).join("")
              : `<p class="small">No Tier 4 items pending.</p>`
            }
            <div class="divider"></div>
            <p class="small"><strong>Global default:</strong> ${POLICY.globalMinSendsForLearning} sends. Role overrides can be approved when needed.</p>
          </div>
        </div>
      `;
    }

    function tplReqLoop(reqId){
      const r = DATA.requisitions.find(x=>x.id===reqId);
      if(!r) return tplBrief();

      setHeader("Req · Interview Loop", "Speed, coverage, scorecards, decision friction.");
      return `
        <div class="detail">
          <div class="detail-head">
            <div>
              <h2>${r.title} — Interview Loop</h2>
              <p>Recruiter-native view: what’s blocking decisions and where the loop is leaking.</p>
            </div>
            <button class="btn ghost" data-nav="req_detail" data-req="${r.id}">← Back</button>
          </div>

          <div class="section">
            <h4>Loop status (stub)</h4>
            <p class="small">Panel coverage: ✅ staffed · Scorecards: ⚠️ 2 pending from yesterday · Decision SLA: 48 hours target</p>
            <div class="divider"></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn" data-toast="Would nudge interviewers (Tier 1, stub).">Send scorecard nudges</button>
              <button class="btn" data-toast="Would open scorecard dashboard (stub).">Open scorecard dashboard</button>
            </div>
          </div>
        </div>
      `;
    }

    function tplProjectDetail(projectId){
      const p = DATA.projects.find(x=>x.id===projectId);
      if(!p) return tplBrief();

      setHeader("Project", "Review next step, then act.");
      return `
        <div class="detail">
          <div class="detail-head">
            <div>
              <h2>${p.title}</h2>
              <p>Due: ${p.due} · Status: ${p.status}</p>
            </div>
            <button class="btn ghost" data-nav="brief">← Back</button>
          </div>

          <div class="section">
            <h4>Next action</h4>
            <p class="small">${p.next}</p>
            <div class="divider"></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn primary" data-toast="Would draft a project update (stub).">Draft update</button>
              <button class="btn" data-toast="Would open project doc (stub).">Open doc</button>
            </div>
          </div>
        </div>
      `;
    }

    function tplBrandDetail(brandId){
      const b = DATA.brand.items.find(x=>x.id===brandId);
      if(!b) return tplBrief();

      setHeader("Brand Item", "Drafts are allowed; posting requires approval.");
      return `
        <div class="detail">
          <div class="detail-head">
            <div>
              <h2>${b.type}: ${b.title}</h2>
              <p>Status: ${b.status} · ${b.note}</p>
            </div>
            <button class="btn ghost" data-nav="brief">← Back</button>
          </div>

          <div class="section">
            <h4>Recommended next step</h4>
            <p class="small">
              Chief can draft a response (Tier 4) and hold it for approval. No posting occurs without explicit confirmation.
            </p>
            <div class="divider"></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn primary" data-toast="Would generate a draft response (stub).">Generate draft</button>
              <button class="btn" data-toast="Would open Glassdoor (stub).">Open Glassdoor</button>
            </div>
          </div>
        </div>
      `;
    }

    /***********************
     * Renderer
     ***********************/
    function render(view, payload={}){
      if(view === "empty"){ mainBody.innerHTML = tplEmpty(); wireNav(); return; }
      if(view === "brief"){ mainBody.innerHTML = tplBrief(); wireNav(); return; }

      if(view === "interview_detail"){ mainBody.innerHTML = tplInterviewDetail(payload.interviewId); wireNav(); return; }
      if(view === "req_detail"){ mainBody.innerHTML = tplReqDetail(payload.reqId); wireNav(); return; }
      if(view === "req_pipeline"){ mainBody.innerHTML = tplReqPipeline(payload.reqId); wireNav(); return; }
      if(view === "req_outreach"){ mainBody.innerHTML = tplReqOutreach(payload.reqId); wireNav(); return; }
      if(view === "req_loop"){ mainBody.innerHTML = tplReqLoop(payload.reqId); wireNav(); return; }

      if(view === "project_detail"){ mainBody.innerHTML = tplProjectDetail(payload.projectId); wireNav(); return; }
      if(view === "brand_detail"){ mainBody.innerHTML = tplBrandDetail(payload.brandId); wireNav(); return; }

      mainBody.innerHTML = tplEmpty();
      wireNav();
    }

    function wireNav(){
      // back buttons + tiles
      mainBody.querySelectorAll("[data-nav]").forEach(el=>{
        el.addEventListener("click", ()=>{
          const to = el.getAttribute("data-nav");
          const reqId = el.getAttribute("data-req");
          if(to && (to.startsWith("req_") || to === "req_detail")){
            render(to, { reqId });
            return;
          }
          render(to);
        });
      });

      // card mini items
      mainBody.querySelectorAll("[data-interview]").forEach(el=>{
        el.addEventListener("click", ()=> render("interview_detail", { interviewId: el.getAttribute("data-interview") }));
      });
      mainBody.querySelectorAll("[data-req]").forEach(el=>{
        el.addEventListener("click", ()=> render("req_detail", { reqId: el.getAttribute("data-req") }));
      });
      mainBody.querySelectorAll("[data-project]").forEach(el=>{
        el.addEventListener("click", ()=> render("project_detail", { projectId: el.getAttribute("data-project") }));
      });
      mainBody.querySelectorAll("[data-brand]").forEach(el=>{
        el.addEventListener("click", ()=> render("brand_detail", { brandId: el.getAttribute("data-brand") }));
      });

      // toast buttons
      mainBody.querySelectorAll("[data-toast]").forEach(el=>{
        el.addEventListener("click", ()=> showToast(el.getAttribute("data-toast")));
      });
    }

    /***********************
     * Chat behavior
     ***********************/
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");

    function handleSend(){
      const t = (chatInput.value || "").trim();
      if(!t) return;

      const lower = t.toLowerCase();
      if(lower.includes("review morning brief") || lower.includes("morning brief")){
        render("brief");
        showToast("Morning brief loaded.");
        return;
      }

      showToast("Try: “Review Morning Brief”. (Demo stub)");
    }

    sendBtn.addEventListener("click", handleSend);
    chatInput.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){ e.preventDefault(); handleSend(); }
    });

    // Pre-fill prompt
    chatInput.value = "Review Morning Brief";
    chatInput.setSelectionRange(chatInput.value.length, chatInput.value.length);

    /***********************
     * Top context (date/time/weather)
     ***********************/
    document.getElementById("dateLine").textContent = fmtDate();

    const timePill = document.getElementById("timePill");
    function tickTime(){ timePill.textContent = "🕘 " + fmtTime(); }
    tickTime();
    setInterval(tickTime, 15000);

    const weatherPill = document.getElementById("weatherPill");
    weatherPill.textContent = `${DATA.weatherLabel} · ${DATA.locationLabel}`;

    /***********************
     * Boot
     ***********************/
    render("empty");
  </script>
</body>
</html>
